name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    # env:
      # ANTHROPIC_BASE_URL: 'https://openrouter.ai/api'
      # ANTHROPIC_AUTH_TOKEN: '${{ secrets.OPEN_ROUTER_KEY }}'
      # ANTHROPIC_API_KEY: ''
      # ANTHROPIC_DEFAULT_SONNET_MODEL: 'qwen/qwen3-coder:free'
      # ANTHROPIC_DEFAULT_OPUS_MODEL: 'openai/gpt-5.2-pro'
      # ANTHROPIC_DEFAULT_HAIKU_MODEL: 'qwen/qwen3-next-80b-a3b-instruct:free'

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      # Uncomment this line to enable task distribution
      # - run: npx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="e2e-ci"

      # Cache node_modules
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps

      - name: Derive appropriate SHAs for base and head
        uses: nrwl/nx-set-shas@v4

      # Prepend any command with "nx-cloud record --" to record its logs to Nx Cloud
      - run: npx nx-cloud record -- npx nx format:check
      # When you enable task distribution, run the e2e-ci task instead of e2e
      - run: npx nx run-many -t lint test build typecheck e2e
      # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/ci/features/self-healing-ci
      - run: npx nx fix-ci
        if: always()
